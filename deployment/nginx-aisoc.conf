# ==============================================================================
# AI-SOC Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/aisoc
# Enable with: sudo ln -s /etc/nginx/sites-available/aisoc /etc/nginx/sites-enabled/
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream unified AI-SOC node server
upstream aisoc_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Optional standalone FastAPI backend upstream (if running backend separately)
upstream aisoc_api_backend {
    server 127.0.0.1:8088 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name soc.example.com; # Replace with your domain or IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is added)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # WebSocket Telemetry Bus (/ws)
    location /ws {
        proxy_pass http://aisoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API & OpenAPI Documentation
    location /api/ {
        proxy_pass http://aisoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Frontend Static Assets & Single Page Application
    location / {
        proxy_pass http://aisoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
